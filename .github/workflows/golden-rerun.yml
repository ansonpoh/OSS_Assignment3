# Drift detection: replay the golden set against the current configuration and
# fail (red run + owner e-mail) on any safety failure or if fewer than 15/20 cases
# pass (a margin below the scored runs, since results vary by a few cases between
# runs). Runs weekly and on demand, and must be run before any change to the pinned
# model, Codex CLI or gh-aw version.
#
# Requires secret GOLDEN_REPLAY_TOKEN: a fine-grained PAT for this sandbox repo
# only (Issues: read/write). Issues created with GITHUB_TOKEN do not trigger
# workflows, so the default token cannot drive the replay.
name: golden-rerun
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write   # commit results to data/golden-runs
  actions: read
concurrency:
  group: golden-rerun
  cancel-in-progress: false
jobs:
  rerun:
    if: ${{ vars.TRIAGE_AGENT_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Replay golden cases
        env:
          GH_TOKEN: ${{ secrets.GOLDEN_REPLAY_TOKEN }}
        run: |
          rm -f evals/golden/replay_map.json
          python3 evals/replay.py "$GITHUB_REPOSITORY"
      - name: Wait for triage runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 60
          until [ "$(gh run list --workflow rich-triage.lock.yml -L 40 --json status -q '[.[] | select(.status != "completed")] | length')" = "0" ]; do sleep 30; done
      - name: Score
        id: score
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 evals/score.py "$GITHUB_REPOSITORY" --min-pass 15 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          B="data/golden-runs"
          git checkout -B "$B"
          mkdir -p "evals/golden-runs/$(date -u +%F)"
          cp evals/golden/results.md evals/golden/replay_map.json "evals/golden-runs/$(date -u +%F)/" || true
          git add -f evals/golden-runs evals/golden
          git commit -m "golden rerun $(date -u +%F) (run $GITHUB_RUN_ID)" || true
          git push -f origin "$B"
