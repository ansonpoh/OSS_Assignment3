# Snapshot historical upstream issues as golden-case inputs (read-only on upstream).
# The data/cases branch is created on first dispatch. The committed golden
# inputs in evals/golden/ came from running the same script locally.
name: collect-cases
on:
  workflow_dispatch:
    inputs:
      repo:
        default: Textualize/rich
      issues:
        description: comma-separated issue numbers
        required: true
permissions:
  contents: write  # only to push results to the data/cases branch
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ inputs.repo }}
          ISSUES: ${{ inputs.issues }}
        run: |
          cd scripts/metrics
          python collect_cases.py --repo "$REPO" --issues "$ISSUES" \
            --out ../../evals/golden/cases --index ../../data/issues_index.json
      - name: Commit results to data/cases branch
        env:
          ISSUES: ${{ inputs.issues }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B data/cases
          git add -f evals/golden/cases data/issues_index.json
          git commit -m "cases: snapshot $ISSUES (run $GITHUB_RUN_ID)"
          git push -f origin data/cases  # a scratch snapshot; the reviewed copy is committed on main
